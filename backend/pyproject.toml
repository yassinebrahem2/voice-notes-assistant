[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.143.0",
    "numpy>=2.5.4,<3",
    "platformdirs>=4.13.3,<5",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.16.0,<3",
    "python-dotenv>=1.2.4,<2",
    "python-multipart~=0.0.32",
    "python-ulid>=4.0.1,<5",
    "pyyaml>=6.0.3,<7",
    "sqlite-vec==0.1.9",
    "uvicorn[standard]~=0.54.0",
    "langchain~=1.4",
    "langgraph~=1.2",
    "langchain-openai~=1.7",
]

[dependency-groups]
dev = [
    "httpx2<3",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "ruff~=0.17.1",
    "types-pyyaml>=6.0.12.20260906,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
